name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push cancel an in-flight build, but never a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # --strict turns warnings (dead internal links, missing nav pages) into
      # failures. On its own that is weaker than it sounds: an unknown #anchor
      # is only INFO, so twelve dead anchor links once built and deployed clean.
      # mkdocs.yml now sets validation.anchors=warn, which --strict escalates,
      # and that combination is what actually blocks a broken link here.
      - run: mkdocs build --strict

      # A line wrapping so it starts with '#' becomes a heading, which no link
      # check can see: '#70 and approved...' once rendered as an H1 and put a
      # nonsense entry in the table of contents. Every page has exactly one H1.
      - name: Exactly one H1 per page
        run: |
          bad=0
          while IFS= read -r f; do
            n=$(grep -c '<h1' "$f" || true)
            if [ "$n" -ne 1 ]; then echo "::error file=$f::expected 1 h1, found $n"; bad=1; fi
          done < <(find site -name index.html)
          exit $bad

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
